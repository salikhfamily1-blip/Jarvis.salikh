<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis - Shaxsiy Yordamchi</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #4f8cff;
    --accent2: #7c5cff;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --bubble-user: #2b6cff;
    --bubble-bot: #232733;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1b1e27, var(--bg));
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 92vh;
    background: var(--panel);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #262a35;
  }
  .header {
    padding: 18px 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3dffa0;
    box-shadow: 0 0 8px #3dffa0;
  }
  .header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  .header p {
    margin: 0;
    font-size: 12px;
    opacity: 0.85;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--muted);
    font-style: italic;
  }
  form {
    display: flex;
    padding: 14px;
    gap: 10px;
    background: #12151b;
    border-top: 1px solid #262a35;
  }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #2b2f3a;
    background: #1b1f28;
    color: var(--text);
    font-size: 14.5px;
    outline: none;
  }
  input[type=text]:focus {
    border-color: var(--accent);
  }
  button {
    padding: 0 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:active { transform: scale(0.97); }
  #resetBtn {
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    border: 1px solid #2b2f3a;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-left: auto;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="dot"></div>
      <div>
        <h1>Jarvis</h1>
        <p>Shaxsiy AI-yordamchingiz</p>
      </div>
      <button id="resetBtn" onclick="resetChat()">Tozalash</button>
    </div>
    <div id="chat"></div>
    <form id="chatForm">
      <input type="text" id="messageInput" placeholder="Xabar yozing..." autocomplete="off" required />
      <button type="submit">Yuborish</button>
    </form>
  </div>

<script>
  const chatEl = document.getElementById('chat');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('messageInput');

  function getSessionId() {
    let sid = localStorage.getItem('jarvis_session_id');
    if (!sid) {
      sid = 'sid_' + Math.random().toString(36).slice(2) + Date.now();
      localStorage.setItem('jarvis_session_id', sid);
    }
    return sid;
  }

  function loadHistory() {
    const raw = localStorage.getItem('jarvis_history');
    if (!raw) return [];
    try { return JSON.parse(raw); } catch { return []; }
  }

  function saveHistory(history) {
    localStorage.setItem('jarvis_history', JSON.stringify(history.slice(-40)));
  }

  function addBubble(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function resetChat() {
    localStorage.removeItem('jarvis_history');
    localStorage.removeItem('jarvis_session_id');
    chatEl.innerHTML = '';
    addBubble('bot', "Salom! Men Jarvisman, sizning shaxsiy yordamchingiz. Nima bilan yordam bera olaman?");
  }

  // Sahifa ochilganda tarixni tiklash
  const history = loadHistory();
  if (history.length === 0) {
    addBubble('bot', "Salom! Men Jarvisman, sizning shaxsiy yordamchingiz. Nima bilan yordam bera olaman?");
  } else {
    history.forEach(m => addBubble(m.role, m.content));
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addBubble('user', text);
    const hist = loadHistory();
    hist.push({ role: 'user', content: text });
    saveHistory(hist);

    const typingEl = document.createElement('div');
    typingEl.className = 'msg typing';
    typingEl.textContent = 'Jarvis yozmoqda...';
    chatEl.appendChild(typingEl);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: getSessionId() })
      });
      const data = await res.json();
      typingEl.remove();
      addBubble('bot', data.reply);
      const hist2 = loadHistory();
      hist2.push({ role: 'assistant', content: data.reply });
      saveHistory(hist2);
    } catch (err) {
      typingEl.remove();
      addBubble('bot', '❌ Server bilan bog\'lanishda xatolik yuz berdi.');
    }
  });
</script>
</body>
</html>
